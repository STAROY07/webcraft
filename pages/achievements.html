<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badges & Achievements — WebCraft Trophy Hall</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Universal Header -->
  <div id="webcraft-header"></div>

  <main class="container" style="padding-top: 24px; margin-bottom: 50px;">
    <!-- Header -->
    <div class="section-header">
      <span class="section-tag">Trophy Showcase</span>
      <h1 class="section-title">Badges & Achievements</h1>
      <p class="section-desc">Unlock badges, level up your rank, and track your web development milestones!</p>
    </div>

    <!-- Stats & Level Gauge Card -->
    <div class="card card-top-blue" style="margin-bottom: 30px; padding: 24px;">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; text-align: center; margin-bottom: 20px;">
        <div>
          <div style="font-size: 11.5px; font-weight: 700; color: var(--text-muted);">TOTAL XP</div>
          <div style="font-size: 24px; font-weight: 900; color: var(--primary-blue);" id="achieveTotalXp">0 XP</div>
        </div>
        <div>
          <div style="font-size: 11.5px; font-weight: 700; color: var(--text-muted);">CURRENT RANK</div>
          <div style="font-size: 17px; font-weight: 900; color: var(--text-main);" id="achieveCurrentLevel">Level 1: Code Beginner</div>
        </div>
        <div>
          <div style="font-size: 11.5px; font-weight: 700; color: var(--text-muted);">LESSONS COMPLETED</div>
          <div style="font-size: 24px; font-weight: 900; color: var(--green);" id="achieveLessonsCount">0 / 32</div>
        </div>
        <div>
          <div style="font-size: 11.5px; font-weight: 700; color: var(--text-muted);">BUGS FIXED</div>
          <div style="font-size: 24px; font-weight: 900; color: #DC2626;" id="achieveBugsCount">0 / 10</div>
        </div>
        <div>
          <div style="font-size: 11.5px; font-weight: 700; color: var(--text-muted);">MISSIONS COMPLETED</div>
          <div style="font-size: 24px; font-weight: 900; color: var(--purple);" id="achieveChallengesCount">0 / 8</div>
        </div>
      </div>

      <!-- Level Progress Bar -->
      <div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px;">
          <span>Level Progress</span>
          <span id="achieveLevelProgressText">0 / 300 XP to Level 2</span>
        </div>
        <div style="width: 100%; height: 10px; background: #E2E8F0; border-radius: var(--radius-pill); overflow: hidden;">
          <div id="achieveLevelProgressFill" style="height: 100%; background: var(--primary-blue); width: 0%; transition: width 0.4s ease;"></div>
        </div>
      </div>
    </div>

    <!-- Badges Grid -->
    <h2 style="font-size: 20px; margin-bottom: 16px;">All Badges</h2>
    <div class="badges-grid" id="badgesGrid">
      <!-- Populated cleanly by achievements.js -->
    </div>
  </main>

  <!-- Universal Footer -->
  <div id="webcraft-footer"></div>

  <!-- Scripts -->
  <script src="../js/icons.js"></script>
  <script src="../js/audio.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/achievements.js"></script>
</body>
</html>
