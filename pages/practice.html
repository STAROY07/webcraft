<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice Arena — WebCraft Coding Tasks</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Universal Header -->
  <div id="webcraft-header"></div>

  <main class="container">
    <div class="learn-layout">
      <!-- Sidebar Practice List -->
      <aside class="sidebar-nav">
        <div style="font-size: 11.5px; font-weight: 800; color: var(--primary-blue); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px;">
          Practice Tasks
        </div>
        <div class="lesson-list" id="taskList">
          <!-- Populated by practice.js -->
        </div>
      </aside>

      <!-- Main Practice Workspace -->
      <section class="lesson-content-card">
        <div class="lesson-header">
          <div>
            <span class="track-tag" id="taskTrackBadge" style="background: #EFF6FF; color: var(--primary-blue); font-weight: 800;">
              HTML
            </span>
            <h1 style="font-size: 24px; margin-top: 4px;" id="taskTitle">Task Loading...</h1>
          </div>
          <div class="stat-pill xp-pill" id="taskXp" style="font-size: 13.5px; padding: 6px 14px;">
            +100 XP
          </div>
        </div>

        <!-- Task Instructions -->
        <div style="background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: var(--radius-md); padding: 14px 18px; margin-bottom: 18px;">
          <div style="font-size: 11.5px; font-weight: 800; color: #16A34A; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px;">
            Task Objective
          </div>
          <p id="taskInstructions" style="font-weight: 700; font-size: 15px; color: #14532D; margin: 0;"></p>
        </div>

        <!-- Progressive Hints Container -->
        <div id="practiceHintContainer" style="margin-bottom: 16px;"></div>

        <!-- Practice Code Playground -->
        <div id="practicePlayground" style="margin-bottom: 20px;"></div>

        <!-- Bottom Actions -->
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-top: 1px solid #F1F5F9; padding-top: 16px;">
          <div style="display: flex; gap: 8px;">
            <button class="btn btn-secondary btn-sm" id="prevPracticeBtn">◀ Previous</button>
            <button class="btn btn-warning btn-sm" id="practiceHintBtn">Reveal Hint 1</button>
          </div>

          <div style="display: flex; gap: 10px;">
            <button class="btn btn-primary btn-lg" id="checkPracticeBtn">
              Check My Code
            </button>
            <button class="btn btn-secondary btn-sm" id="nextPracticeBtn">Next ▶</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- Universal Footer -->
  <div id="webcraft-footer"></div>

  <!-- Scripts -->
  <script src="../js/icons.js"></script>
  <script src="../js/audio.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/playground.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/practice.js"></script>
</body>
</html>
